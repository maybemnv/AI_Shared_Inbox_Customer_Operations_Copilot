name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install --requirement ../../requirements-dev.txt
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag inbox-api:ci .
      - run: docker run --detach --name inbox-api --publish 8103:8103 --env APP_ENV=local-fixture inbox-api:ci
      - name: Verify container boot
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8103/readyz && exit 0
            sleep 1
          done
          docker logs inbox-api
          exit 1
      - if: always()
        run: docker rm --force inbox-api
